<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="login-container">

        <div class="login-title">

            <p class="subtitle">
                ACCOUNT
            </p>

            <h1>
                Register
            </h1>

            <p class="description">
                Create your WhoIsTheWinner account.
            </p>

        </div>


        <form
            id="registerForm"
            class="login-form"
        >

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter Username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >

            </div>


            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter Password Again"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Register
            </button>


            <p
                id="registerMessage"
                class="login-message"
            ></p>

        </form>


        <button
            class="back-button"
            onclick="goBackToLogin()"
        >
            ← Back to Login
        </button>

    </main>

    <script src="js/Storage/save-data-storage.js"></script>
    <script src="js/register.js"></script>

</body>

</html>
