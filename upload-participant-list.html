
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload Participant List</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<main class="create-container">


    <!-- =====================================================
         PAGE TITLE
         ===================================================== -->

    <div class="create-title">

        <p class="subtitle">
            PARTICIPANT LIST
        </p>

        <h1>
            Upload Participant List
        </h1>

        <p class="description">
            Choose a saved tournament participant list.
        </p>

    </div>


    <!-- =====================================================
         Saved Tournament List
         ===================================================== -->

    <section class="participant-section">

        <div class="section-header">

            <h2>
                Saved Tournaments
            </h2>

            <span
                class="participant-count"
                id="saveDataCount"
            >
                0 Lists
            </span>

        </div>


        <!-- =================================================
             Scroll Box
             ================================================= -->

        <div
            class="participant-list"
            id="saveDataList"
        >

        </div>

    </section>


    <!-- =====================================================
         Go Back
         ===================================================== -->

    <button
        class="back-button"
        onclick="goBack()"
    >

        ← Go Back

    </button>


</main>


<!-- =========================================================
     JavaScript
     ========================================================= -->

<script src="js/S/swiss-data.js"></script>

<script src="js/S/participant.js"></script>

<script src="js/S/main-tournament-memory.js"></script>

<script src="js/S/tournament-state.js"></script>

<script src="js/S/save-data.js"></script>

<script src="js/S/default-participants-list.js"></script>

<script src="js/Storage/save-data-storage.js"></script>

<script src="js/upload-participant-list.js"></script>


</body>

</html>
