<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="login-container">

        <div class="login-title">

            <p class="subtitle">
                ACCOUNT
            </p>

            <h1>
                Login
            </h1>

            <p class="description">
                Login to your WhoIsTheWinner account.
            </p>

        </div>


        <form
            id="loginForm"
            class="login-form"
        >

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter Username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


            <p
                id="loginMessage"
                class="login-message"
            ></p>

            <p class="account-link">

            Don't have an account?

            <button
                type="button"
                onclick="goToRegister()"
            >
                Register
            </button>

            </p>

        </form>


        <button
            class="back-button"
            onclick="goBack()"
        >
            ← Go Back
        </button>

    </main>


    <script src="js/Storage/save-data-storage.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
