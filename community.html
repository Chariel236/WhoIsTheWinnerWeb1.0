<!DOCTYPE html>

    <title>Community</title>

    <link

        ================================================= -->

        <div class="community-title">

            <p class="subtitle">
                TOURNAMENT

                Community
            </h1>

            <p class="description">
                Browse and share tournaments with the community.
            </p>

        </div>


        <!-- =================================================
             Search
        ================================================= -->

        <div class="community-search">

            <input
                type="text"
                id="communitySearchInput"
                class="community-search-input"
                placeholder="Search Tournament Name..."
                autocomplete="off"
            >

        </div>

        <section class="community-section">

        <!-- =================================================

        <button
            type="button"
            class="community-upload-button"
            onclick="openUploadTournament()"
        >

            <span>
                ↑
            </span>

            Upload Tournament

        </button>


        <!-- =================================================

        ================================================= -->

        <button
